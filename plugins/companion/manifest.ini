[Plugin]
Id=companion
Name=Bitfocus Companion
Name[it]=Bitfocus Companion
Description=Persistent Companion control with a local web interface
Description[it]=Controllo Companion persistente con interfaccia web locale
Version=1
MinimumWasalight=2026.08.09.3
Category=Services
Icon=/usr/local/share/icons/wasalight/companion-official.png
Homepage=https://bitfocus.io/companion
License=MIT (core); bundled modules retain their own licenses
Dependencies=network,systemd,nodejs
BackupPaths=/data/companion
InstalledVersionFile=/data/companion/installed-version
UpdateChannel=pinned
InstalledCheck=/opt/companion
DefaultEnabled=false
Optional=true

[Runtime]
Type=systemd
Unit=companion.service
AutoEnable=true
Port=8000
ActiveLabel=Active on TCP 8000
ActiveLabel[it]=Attivo su TCP 8000
InactiveLabel=Stopped
InactiveLabel[it]=Fermo
AutomaticLabel=AUTO
ManualLabel=MANUAL
ManualLabel[it]=MANUALE

[Persistence]
Key=companion-autostart

[Control runtime]
Label=Service active
Label[it]=Servizio attivo
State=active
OnAction=start
OffAction=stop
Modes=show,maintenance

[Control automatic]
Label=Automatic startup
Label[it]=Avvio automatico
State=persistent
OnAction=auto-enable
OffAction=auto-disable
Modes=show,maintenance

[Action auto-enable]
Command=/usr/local/sbin/wasalight-remote-persistence companion enable
Privilege=root
Modes=show,maintenance

[Action auto-disable]
Command=/usr/local/sbin/wasalight-remote-persistence companion disable
Privilege=root
Modes=show,maintenance

[Action start]
Label=Start
Label[it]=Avvia
Command=/usr/local/sbin/wasalight-companion-control start
Privilege=root
Modes=show,maintenance

[Action stop]
Label=Stop
Label[it]=Ferma
Command=/usr/local/sbin/wasalight-companion-control stop
Privilege=root
Modes=show,maintenance
Confirm=Stop Bitfocus Companion?
Confirm[it]=Fermare Bitfocus Companion?

[Action restart]
Label=Restart
Label[it]=Riavvia
Command=/usr/local/sbin/wasalight-companion-control restart
Privilege=root
Modes=show,maintenance

[Action open]
Label=Open web interface
Label[it]=Apri interfaccia web
Command=/usr/local/bin/wasalight-companion-browser
Privilege=user
Modes=show,maintenance
Detached=true

[Action backup]
Label=Create backup
Label[it]=Crea backup
Command=/usr/local/sbin/wasalight-companion-backup
Privilege=root
Modes=maintenance
Management=true
ShowOutput=true
Confirm=Create a new persistent Companion backup?
Confirm[it]=Creare un nuovo backup persistente di Companion?

[Action update]
Label=Update
Label[it]=Aggiorna
Command=/usr/local/bin/wasalight-companion-update-terminal
Privilege=user
Modes=maintenance
Detached=true
Management=true
