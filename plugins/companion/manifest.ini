[Plugin]
Id=companion
Name=Bitfocus Companion
Description=Controllo Companion persistente con interfaccia web locale
Version=1
MinimumWasalight=2026.08.09.3
Category=Services
Icon=/usr/local/share/icons/wasalight/companion.svg
InstalledCheck=/opt/companion
DefaultEnabled=false

[Runtime]
Type=systemd
Unit=companion.service
AutoEnable=true
ActiveLabel=Active on TCP 8000
InactiveLabel=Stopped

[Action start]
Label=Start
Command=/usr/local/sbin/wasalight-companion-control start
Privilege=root
Modes=show,maintenance

[Action stop]
Label=Stop
Command=/usr/local/sbin/wasalight-companion-control stop
Privilege=root
Modes=show,maintenance
Confirm=Stop Bitfocus Companion?

[Action restart]
Label=Restart
Command=/usr/local/sbin/wasalight-companion-control restart
Privilege=root
Modes=show,maintenance

[Action open]
Label=Open Web UI
Command=/usr/local/bin/wasalight-companion-browser
Privilege=user
Modes=show,maintenance
Detached=true
