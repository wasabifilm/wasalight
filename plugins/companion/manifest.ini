[Plugin]
Id=companion
Name=Bitfocus Companion
Description=Controllo Companion persistente con interfaccia web locale
Version=1
MinimumWasalight=2026.08.09.3
Category=Services
Icon=/usr/local/share/icons/wasalight/companion-official.png
Homepage=https://bitfocus.io/companion
License=MIT (core); bundled modules retain their own licenses
Dependencies=network,systemd,nodejs
BackupPaths=/data/companion
InstalledVersionFile=/data/companion/installed-version
UpdateChannel=pinned
InstalledCheck=/opt/companion
DefaultEnabled=false
Optional=true

[Runtime]
Type=systemd
Unit=companion.service
AutoEnable=true
Port=8000
ActiveLabel=Attivo su TCP 8000
InactiveLabel=Fermo

[Persistence]
Key=companion-autostart

[Control runtime]
Label=Servizio attivo
State=active
OnAction=start
OffAction=stop
Modes=show,maintenance

[Control automatic]
Label=Avvio automatico
State=persistent
OnAction=auto-enable
OffAction=auto-disable
Modes=show,maintenance

[Action auto-enable]
Command=/usr/local/sbin/wasalight-remote-persistence companion enable
Privilege=root
Modes=show,maintenance

[Action auto-disable]
Command=/usr/local/sbin/wasalight-remote-persistence companion disable
Privilege=root
Modes=show,maintenance

[Action start]
Label=Avvia
Command=/usr/local/sbin/wasalight-companion-control start
Privilege=root
Modes=show,maintenance

[Action stop]
Label=Ferma
Command=/usr/local/sbin/wasalight-companion-control stop
Privilege=root
Modes=show,maintenance
Confirm=Fermare Bitfocus Companion?

[Action restart]
Label=Riavvia
Command=/usr/local/sbin/wasalight-companion-control restart
Privilege=root
Modes=show,maintenance

[Action open]
Label=Apri interfaccia web
Command=/usr/local/bin/wasalight-companion-browser
Privilege=user
Modes=show,maintenance
Detached=true

[Action backup]
Label=Crea backup
Command=/usr/local/sbin/wasalight-companion-backup
Privilege=root
Modes=maintenance
Management=true
ShowOutput=true
Confirm=Creare un nuovo backup persistente di Companion?

[Action update]
Label=Aggiorna
Command=/usr/local/bin/wasalight-companion-update-terminal
Privilege=user
Modes=maintenance
Detached=true
Management=true
