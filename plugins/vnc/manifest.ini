[Plugin]
Id=vnc
Name=VNC session
Name[it]=Sessione VNC
Description=Remote sharing of the current Xorg session
Description[it]=Condivisione remota della sessione Xorg corrente
Version=1
MinimumWasalight=2026.08.09.3
Category=Services
Icon=/usr/local/share/icons/wasalight/vnc.svg
InstalledCheck=/usr/bin/x11vnc
DefaultEnabled=true
Optional=false

[Runtime]
Type=process
Process=x11vnc
User=chamsys
AutoEnable=false
ActiveLabel=Active on TCP 5900
ActiveLabel[it]=Attivo su TCP 5900
InactiveLabel=Stopped
InactiveLabel[it]=Fermo
AutomaticLabel=AUTO
ManualLabel=MANUAL
ManualLabel[it]=MANUALE

[Persistence]
Key=vnc-autostart

[Control runtime]
Label=Service active
Label[it]=Servizio attivo
State=active
OnAction=start
OffAction=stop
Modes=show,maintenance

[Control automatic]
Label=Automatic startup
Label[it]=Avvio automatico
State=persistent
OnAction=auto-enable
OffAction=auto-disable
Modes=show,maintenance

[Action auto-enable]
Command=/usr/local/sbin/wasalight-remote-persistence vnc enable
Privilege=root
Modes=show,maintenance

[Action auto-disable]
Command=/usr/local/sbin/wasalight-remote-persistence vnc disable
Privilege=root
Modes=show,maintenance

[Action start]
Label=Start
Label[it]=Avvia
Command=/usr/local/bin/wasalight-vnc-control start
Privilege=user
Modes=show,maintenance

[Action stop]
Label=Stop
Label[it]=Ferma
Command=/usr/local/bin/wasalight-vnc-control stop
Privilege=user
Modes=show,maintenance
