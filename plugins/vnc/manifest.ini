[Plugin]
Id=vnc
Name=VNC Session
Description=Condivisione remota della sessione Xorg corrente
Version=1
MinimumWasalight=2026.08.09.3
Category=Services
Icon=/usr/local/share/icons/wasalight/vnc.svg
InstalledCheck=/usr/bin/x11vnc
DefaultEnabled=true

[Runtime]
Type=process
Process=x11vnc
User=chamsys
AutoEnable=false
ActiveLabel=Active on TCP 5900
InactiveLabel=Stopped

[Action toggle]
Label=Start / Stop
Command=/usr/local/bin/wasalight-vnc-toggle
Privilege=user
Modes=show,maintenance
Detached=true
