[Plugin]
Id=vnc
Name=Sessione VNC
Description=Condivisione remota della sessione Xorg corrente
Version=1
MinimumWasalight=2026.08.09.3
Category=Services
Icon=/usr/local/share/icons/wasalight/vnc.svg
InstalledCheck=/usr/bin/x11vnc
DefaultEnabled=true
Optional=false

[Runtime]
Type=process
Process=x11vnc
User=chamsys
AutoEnable=false
ActiveLabel=Attivo su TCP 5900
InactiveLabel=Fermo

[Persistence]
Key=vnc-autostart

[Action automatic]
Label=Automatico
Command=/usr/local/bin/wasalight-remote-auto-toggle vnc
Privilege=user
Modes=show,maintenance
Detached=true

[Action toggle]
Label=Avvia / Ferma
Command=/usr/local/bin/wasalight-vnc-toggle
Privilege=user
Modes=show,maintenance
Detached=true
