[Plugin]
Id=ssh
Name=SSH access
Name[it]=Accesso SSH
Description=Secure remote access to the Wasalight console
Description[it]=Accesso remoto sicuro alla console Wasalight
Version=1
MinimumWasalight=2026.08.09.3
Category=Services
Icon=/usr/local/share/icons/wasalight/ssh.svg
InstalledCheck=/usr/sbin/sshd
DefaultEnabled=true
Optional=false

[Runtime]
Type=systemd
Unit=ssh.service
AutoEnable=false
ActiveLabel=Active on TCP 22
ActiveLabel[it]=Attivo su TCP 22
InactiveLabel=Stopped
InactiveLabel[it]=Fermo
AutomaticLabel=AUTO
ManualLabel=MANUAL
ManualLabel[it]=MANUALE

[Persistence]
Key=ssh-autostart

[Control runtime]
Label=Service active
Label[it]=Servizio attivo
State=active
OnAction=start
OffAction=stop
Modes=show,maintenance

[Control automatic]
Label=Automatic startup
Label[it]=Avvio automatico
State=persistent
OnAction=auto-enable
OffAction=auto-disable
Modes=show,maintenance

[Action auto-enable]
Command=/usr/local/sbin/wasalight-remote-persistence ssh enable
Privilege=root
Modes=show,maintenance

[Action auto-disable]
Command=/usr/local/sbin/wasalight-remote-persistence ssh disable
Privilege=root
Modes=show,maintenance

[Action start]
Label=Start
Label[it]=Avvia
Command=/usr/local/sbin/wasalight-ssh-control start
Privilege=root
Modes=show,maintenance

[Action stop]
Label=Stop
Label[it]=Ferma
Command=/usr/local/sbin/wasalight-ssh-control stop
Privilege=root
Modes=show,maintenance
