[Plugin]
Id=ssh
Name=Accesso SSH
Description=Accesso remoto sicuro alla console Wasalight
Version=1
MinimumWasalight=2026.08.09.3
Category=Services
Icon=/usr/local/share/icons/wasalight/ssh.svg
InstalledCheck=/usr/sbin/sshd
DefaultEnabled=true
Optional=false

[Runtime]
Type=systemd
Unit=ssh.service
AutoEnable=false
ActiveLabel=Attivo su TCP 22
InactiveLabel=Fermo

[Persistence]
Key=ssh-autostart

[Control runtime]
Label=Servizio attivo
State=active
OnAction=start
OffAction=stop
Modes=show,maintenance

[Control automatic]
Label=Avvio automatico
State=persistent
OnAction=auto-enable
OffAction=auto-disable
Modes=show,maintenance

[Action auto-enable]
Command=/usr/local/sbin/wasalight-remote-persistence ssh enable
Privilege=root
Modes=show,maintenance

[Action auto-disable]
Command=/usr/local/sbin/wasalight-remote-persistence ssh disable
Privilege=root
Modes=show,maintenance

[Action start]
Label=Avvia
Command=/usr/local/sbin/wasalight-ssh-control start
Privilege=root
Modes=show,maintenance

[Action stop]
Label=Ferma
Command=/usr/local/sbin/wasalight-ssh-control stop
Privilege=root
Modes=show,maintenance
