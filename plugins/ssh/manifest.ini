[Plugin]
Id=ssh
Name=SSH Access
Description=Accesso remoto sicuro alla console Wasalight
Version=1
MinimumWasalight=2026.08.09.3
Category=Services
Icon=/usr/local/share/icons/wasalight/ssh.svg
InstalledCheck=/usr/sbin/sshd
DefaultEnabled=true

[Runtime]
Type=systemd
Unit=ssh.service
AutoEnable=false
ActiveLabel=Active on TCP 22
InactiveLabel=Stopped

[Action start]
Label=Start
Command=/usr/local/sbin/wasalight-ssh-control start
Privilege=root
Modes=show,maintenance
Confirm=Enable SSH access for this session?

[Action stop]
Label=Stop
Command=/usr/local/sbin/wasalight-ssh-control stop
Privilege=root
Modes=show,maintenance
Confirm=Stop the current SSH service?
