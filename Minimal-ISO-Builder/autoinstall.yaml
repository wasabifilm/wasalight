#cloud-config
autoinstall:
  version: 1
  locale: en_US.UTF-8
  timezone: "__WASALIGHT_TIMEZONE__"
  keyboard:
    layout: "__WASALIGHT_KEYBOARD_LAYOUT__"
    variant: "__WASALIGHT_KEYBOARD_VARIANT__"
  identity:
    hostname: wasalight
    realname: Wasalight Operator
    username: chamsys
    password: "__WASALIGHT_PASSWORD_HASH__"
  source:
    id: ubuntu-server-minimal
    search_drivers: false
  ssh:
    install-server: false
    allow-pw: false
    authorized-keys: []
  packages: [git, gettext]
  storage:
    config:
    - type: disk
      id: disk0
      ptable: gpt
      wipe: superblock-recursive
      preserve: false
      grub_device: false # __WASALIGHT_DISK_GRUB_DEVICE__
      path: __WASALIGHT_TARGET_DISK__
    - type: partition
      id: partition-bios-grub
      device: disk0
      size: 1048576
      flag: bios_grub
      number: 1
      preserve: false
      grub_device: false
    - type: partition
      id: partition-efi
      device: disk0
      size: 1127219200
      flag: boot
      number: 2
      wipe: superblock
      preserve: false
      grub_device: true # __WASALIGHT_EFI_GRUB_DEVICE__
    - type: format
      id: format-efi
      volume: partition-efi
      fstype: fat32
      preserve: false
    - type: partition
      id: partition-boot
      device: disk0
      size: 2147483648
      number: 3
      wipe: superblock
      preserve: false
      grub_device: false
    - type: format
      id: format-boot
      volume: partition-boot
      fstype: ext4
      preserve: false
    - type: partition
      id: partition-lvm
      device: disk0
      size: -1
      number: 4
      wipe: superblock
      preserve: false
      grub_device: false
    - type: lvm_volgroup
      id: vg0
      name: ubuntu-vg
      devices:
      - partition-lvm
      preserve: false
    - type: lvm_partition
      id: lv-root
      name: ubuntu-lv
      volgroup: vg0
      size: 50%
      wipe: superblock
      preserve: false
    - type: format
      id: format-root
      volume: lv-root
      fstype: ext4
      preserve: false
    - type: mount
      id: mount-root
      device: format-root
      path: /
    - type: lvm_partition
      id: lv-data
      name: data
      volgroup: vg0
      wipe: superblock
      preserve: false
    - type: format
      id: format-data
      volume: lv-data
      fstype: ext4
      preserve: false
    - type: mount
      id: mount-data
      device: format-data
      path: /data
    - type: mount
      id: mount-boot
      device: format-boot
      path: /boot
    - type: mount
      id: mount-efi
      device: format-efi
      path: /boot/efi
  updates: security
  shutdown: poweroff
  reporting:
    wasalight:
      type: webhook
      endpoint: http://127.0.0.1:8765/
      level: INFO
  early-commands:
  - nohup sh /cdrom/wasalight/apply-theme.sh /dev/tty1 >/run/wasalight-theme.log 2>&1 &
  - printf '%s\n' '__WASALIGHT_INSTALL_VARIANT__' >/run/wasalight-install-variant
  - nohup python3 /cdrom/wasalight/install-ui.sh /dev/tty2 >/run/wasalight-ui.log 2>&1 &
  - >-
    sh -c 'i=0;
      while [ ! -e /run/wasalight-ui-ready ] && [ "$i" -lt 60 ]; do
        i=$((i + 1)); sleep 1;
      done;
      if [ ! -e /run/wasalight-ui-ready ]; then
        echo "UI not ready after 60 seconds; text installation remains active" >>/run/wasalight-ui.log;
      fi;
      true'
  - sh /cdrom/wasalight/preflight.sh
  - python3 /cdrom/wasalight/install-wizard.py /dev/tty1
  - chvt 2 || true
  late-commands:
  - install -D -m 0640 /run/wasalight-interface-language /target/data/system/control/language
  - install -D -m 0755 /cdrom/wasalight/wasalight-first-boot.sh /target/usr/local/sbin/wasalight-first-boot
  - install -D -m 0644 /cdrom/wasalight/wasalight-first-boot.service /target/etc/systemd/system/wasalight-first-boot.service
  - install -D -m 0644 /cdrom/wasalight/release-manifest.ini /target/etc/wasalight/release-manifest.ini
  - install -D -m 0644 /cdrom/wasalight/wasalight-release-manifest.sh /target/usr/local/libexec/wasalight-release-manifest.sh
  - __WASALIGHT_NETWORK_PRELOAD__
  - curtin in-target --target=/target -- systemctl enable wasalight-first-boot.service
  - sh /cdrom/wasalight/save-installer-logs.sh success
  - touch /run/wasalight-install-success
  - sh /cdrom/wasalight/wait-for-poweroff.sh
  error-commands:
  - sh /cdrom/wasalight/save-installer-logs.sh failed || true
  - >-
    sh -c '{
      echo "Installation failed" >/run/wasalight-install-failed;
      echo;
      echo "==============================================================";
      echo "           WASALIGHT v__WASALIGHT_INSTALLER_VERSION__ - INSTALLATION ERROR";
      echo "==============================================================";
      echo;
      echo "--- FINAL AUTOINSTALL ---";
      sed -E "s/^([[:space:]]*password:).*/\1 \"<redacted>\"/" /autoinstall.yaml 2>/dev/null || true;
      echo;
      echo "--- WASALIGHT UI LOG ---";
      cat /run/wasalight-ui.log 2>/dev/null || true;
      echo;
      echo "--- SUBIQUITY SERVER DEBUG (last 120 lines) ---";
      tail -n 120 /var/log/installer/subiquity-server-debug.log 2>/dev/null || true;
      echo;
      echo "--- CURTIN LOG (last 80 lines) ---";
      tail -n 80 /var/log/installer/curtin-install.log 2>/dev/null || true;
      echo;
      echo "==============================================================";
      echo "Take a photo of this screen.";
      echo "Press ENTER to open a shell on console 3.";
    } >/dev/tty1;
    read _x </dev/tty1;
    if command -v openvt >/dev/null 2>&1; then
      exec openvt -c 3 -f -s -w -- /bin/sh;
    fi;
    exec setsid -f --wait --ctty sh -c "exec sh </dev/tty1 >/dev/tty1 2>&1"'
